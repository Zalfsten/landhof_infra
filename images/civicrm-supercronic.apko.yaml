contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local /work/build/packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - wget       # currently needed to download extensions
    - gnutar     # use gnu-tar instead of tar
    - gzip       # for .gz compression/decompression
    - civicrm-supercronic@local

cmd: /usr/bin/supercronic /etc/supercronic/crontab

accounts:
  run-as: supercronic
  users:
    - username: civicrm
      uid: 61616
      gid: 61616
      shell: /sbin/nologin
    - username: supercronic
      uid: 61618
      gid: 61616
      shell: /sbin/nologin
  groups:
    - groupname: civicrm
      gid: 61616

work-dir: /var/www/civicrm
