contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local /work/build/packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    # - wget       # currently needed to download extensions
    # - gnutar     # use gnu-tar instead of tar
    # - gzip       # for .gz compression/decompression
    - civicrm-php-fpm@local

entrypoint:
  command: /usr/bin/civicrm_init_php-fpm_healthchecks.sh

cmd: /usr/sbin/php-fpm

accounts:
  run-as: fpm
  users:
    - username: civicrm
      uid: 61616
      gid: 61616
      shell: /sbin/nologin
    - username: fpm
      uid: 61617
      gid: 61616
      shell: /sbin/nologin
    - username: webserver
      uid: 101
      shell: /sbin/nologin
  groups:
    - groupname: civicrm
      gid: 61616

work-dir: /var/www/civicrm
