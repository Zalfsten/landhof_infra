contents:
  repositories:
    - https://packages.wolfi.dev/os
    - '@local /work/build/packages'
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    # - wget       # currently needed to download extensions
    # - gnutar     # use gnu-tar instead of tar
    # - gzip       # for .gz compression/decompression
    - civicrm@local

entrypoint:
  command: "/usr/bin/civicrm_init.sh"

accounts:
  run-as: civicrm
  users:
    - username: civicrm
      uid: 61616
      gid: 61616
      shell: /sbin/nologin
    - username: webserver
      uid: 101
      shell: /sbin/nologin
  groups:
    - groupname: civicrm
      gid: 61616

paths:
  - path: /var/www/civicrm
    type: permissions
    uid: 61616
    gid: 61616
    permissions: 0o0750
  - path: /var/www/civicrm/public
    type: permissions
    uid: 61616
    gid: 61616
    permissions: 0o0770
  - path: /var/www/civicrm/private
    type: permissions
    uid: 61616
    gid: 61616
    permissions: 0o0770
  - path: /var/www/civicrm/ext
    type: permissions
    uid: 61616
    gid: 61616
    permissions: 0o0770

work-dir: /var/www/civicrm
