vars:
  squid_version:

package:
  name: squid-config
  version: ${{vars.squid_version}}
  epoch: 0
  description: "A a config folder in /etc/squid for squid proxy server"
  copyright:
    - license: MIT

  dependencies:
    runtime:
      - squid

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/etc/squid/conf.d ${{targets.destdir}}/etc/squid/whitelists
      cp squid.conf ${{targets.destdir}}/etc/squid/squid.conf

subpackages:

  - name: squid-config-civicrm
    description: "squid config for civicrm"

    pipeline:
      - runs: |
         cp --parents conf.d/civicrm.conf whitelists/civicrm_whitelist.txt ${{targets.subpkgdir}}/etc/squid/

    dependencies:
      runtime:
        - squid-config
