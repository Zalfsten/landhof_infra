name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env file
        id: dotenv
        run: |
          # Read .env from deploy directory
          if [ -f deploy/.env ]; then
            cat deploy/.env >> $GITHUB_ENV
          else
            echo "::error::deploy/.env not found"
            exit 1
          fi

      - name: Setup Melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Generate Melange Key
        run: |
          melange keygen melange.rsa
          # Ensure key is available for next steps
          echo "MELANGE_KEY_PATH=${{ github.workspace }}/melange.rsa" >> $GITHUB_ENV
          echo "MELANGE_PUB_PATH=${{ github.workspace }}/melange.rsa.pub" >> $GITHUB_ENV

      - name: Create build vars file
        run: |
          mkdir -p build_output
          cat <<EOF > build_output/build.vars.yaml
          civicrm_version: ${{ env.CIVICRM_VERSION }}
          civicrm_cv_version: ${{ env.CIVICRM_CV_VERSION }}
          civicrm_php_version: ${{ env.CIVICRM_PHP_VERSION }}
          civicrm_banking_version: ${{ env.CIVICRM_BANKING_VERSION }}
          supercronic_version: ${{ env.SUPERCRONIC_VERSION }}
          squid_version: ${{ env.SQUID_VERSION }}
          EOF

      - name: Build Packages
        run: |
          mkdir -p build_output/packages
          
          # List of packages to build
          PACKAGES="aqbanking civicrm squid-config supercronic"
          
          for pkg in $PACKAGES; do
            echo "Building package: $pkg"
            melange build build/packages/$pkg/.melange.yaml \
              --arch x86_64,aarch64 \
              --signing-key melange.rsa \
              --vars-file build_output/build.vars.yaml \
              --repository-append https://packages.wolfi.dev/os \
              --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
              --out-dir build_output/packages
          done

      - name: Upload Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: build_output/packages
          retention-days: 1

      - name: Upload Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melange-key
          path: melange.rsa.pub
          retention-days: 1

  build-images:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env file
        run: |
          if [ -f deploy/.env ]; then
            cat deploy/.env >> $GITHUB_ENV
          fi

      - name: Setup Apko
        uses: chainguard-dev/actions/setup-apko@main

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: build_output/packages

      - name: Download Key
        uses: actions/download-artifact@v4
        with:
          name: melange-key
          path: .

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          # List of images to build
          IMAGES="civicrm-init civicrm-php-fpm civicrm-supercronic civicrm-aqbanking squid"
          
          for img in $IMAGES; do
            echo "Building image: $img"
            config_file="build/images/${img}.apko.yaml"
            
            # Determine version tag based on image name
            VERSION=""
            if [[ "$img" == "squid" ]]; then
              VERSION="${{ env.SQUID_VERSION }}"
            else
              VERSION="${{ env.CIVICRM_VERSION }}"
            fi

            # Patch apko config to use local build_output/packages instead of /work/build/packages
            sed -i 's|/work/build/packages|./build_output/packages|g' $config_file
            
            FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${img}:${VERSION}"
            LATEST_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${img}:latest"
            
            apko publish $config_file \
              $FULL_IMAGE_NAME,$LATEST_IMAGE_NAME \
              --arch x86_64,aarch64 \
              --repository-append build_output/packages \
              --keyring-append melange.rsa.pub 
              
            # Note: apko build with destination args handles the push if authenticated
            # However, the action `chainguard-dev/actions/setup-apko` sets up apko.
            # Usually `apko build ... destination` pushes if credentials are available.
            # But explicitly using `apko publish` or ensuring `apko build` pushes is better.
            # `apko build` supports pushing directly.
          done
